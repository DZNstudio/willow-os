<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/coldstar/">
    <title>COLDSTAR | System Overview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --fg: #000000;
            --border: 1px solid var(--fg);
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 2rem;
            --spacing-lg: 4rem;
            --spacing-xl: 8rem;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        ::selection {
            background-color: var(--fg);
            color: var(--bg);
        }
        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: var(--font-main);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        #root {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .site-wrapper {
            display: grid;
            grid-template-columns: 320px 1fr;
            min-height: 100vh;
            border-bottom: var(--border);
            position: relative;
            z-index: 1;
        }
        .sidebar {
            border-right: var(--border);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }
        .brand-header {
            padding: var(--spacing-md);
            border-bottom: var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-mark {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            line-height: 1;
        }
        .sys-code {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .main-nav {
            padding: var(--spacing-md);
            flex-grow: 1;
        }
        .main-nav ul {
            list-style: none;
            display: flex;
            flex-direction: column;
        }
        .main-nav li {
            border-bottom: var(--border);
        }
        .main-nav li:first-child {
            border-top: var(--border);
        }
        .main-nav a {
            display: flex;
            justify-content: space-between;
            text-decoration: none;
            color: var(--fg);
            font-size: 1.125rem;
            font-weight: 600;
            padding: var(--spacing-sm) 0;
            letter-spacing: -0.01em;
            transition: all 0.2s ease;
        }
        .main-nav a:hover {
            padding-left: var(--spacing-xs);
        }
        .nav-indicator {
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .main-nav a:hover .nav-indicator {
            opacity: 1;
        }
        .sidebar-meta {
            padding: var(--spacing-md);
            border-top: var(--border);
            background-color: var(--bg);
        }
        .meta-title {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: var(--spacing-sm);
        }
        .data-table {
            width: 100%;
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: var(--spacing-sm);
        }
        .data-row {
            display: grid;
            grid-template-columns: 80px 1fr;
            padding: 2px 0;
        }
        .data-label {
            font-weight: 600;
        }
        .data-value {
            font-weight: 400;
        }
        .meta-desc {
            font-size: 0.9rem;
            line-height: 1.5;
            padding-top: var(--spacing-sm);
            border-top: var(--border);
        }
        .meta-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-sm);
            padding-top: var(--spacing-sm);
        }
        .meta-stat {
            text-align: center;
        }
        .meta-stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .meta-stat-label {
            font-size: 0.55rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.5;
            margin-top: 2px;
        }
        .content {
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .top-bar {
            height: 73px;
            border-bottom: var(--border);
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 var(--spacing-md);
            gap: var(--spacing-md);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .top-bar-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }
        .hero-section {
            padding: var(--spacing-lg) var(--spacing-md);
            display: flex;
            flex-direction: column;
            border-bottom: var(--border);
        }
        .giant-text-wrapper {
            position: relative;
        }
        .giant-text {
            font-size: clamp(4rem, 12vw, 15rem);
            font-weight: 700;
            line-height: 0.85;
            letter-spacing: -0.04em;
            margin-bottom: 0;
            text-transform: uppercase;
        }
        .parallax-track {
            display: none;
        }
        .parallax-line {
            display: none;
        }
        .parallax-star {
            position: fixed;
            left: 24px;
            top: 50%;
            z-index: 20;
            pointer-events: none;
            will-change: transform;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease-out;
        }
        .parallax-star svg {
            width: 22px;
            height: 22px;
            fill: var(--fg);
            opacity: 0.6;
        }
        .parallax-star.hidden {
            opacity: 0;
        }
        .schematic-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--spacing-xl) 0;
            position: relative;
            perspective: 1200px;
        }
        .schematic-3d-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }
        .schematic-3d-wrapper.dragging {
            transition: none;
        }
        .schematic-svg {
            width: 100%;
            height: auto;
            display: block;
        }
        /* Interactive hotspots overlaid on the SVG */
        .hotspot {
            position: absolute;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1.5px solid transparent;
            background: transparent;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
            z-index: 2;
        }
        .hotspot::before {
            content: '';
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            background: transparent;
            transition: all 0.3s ease;
        }
        .hotspot:hover {
            border-color: var(--fg);
            background: rgba(0, 0, 0, 0.04);
        }
        .hotspot:hover::before {
            background: var(--fg);
        }
        .hotspot.active {
            border-color: var(--fg);
            background: rgba(0, 0, 0, 0.06);
            width: 44px;
            height: 44px;
        }
        .hotspot.active::before {
            background: var(--fg);
        }
        .hotspot-label {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 6px;
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .hotspot:hover .hotspot-label,
        .hotspot.active .hotspot-label {
            opacity: 1;
        }
        .schematic-label {
            position: absolute;
            bottom: var(--spacing-md);
            left: var(--spacing-md);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            z-index: 1;
        }
        .schematic-controls {
            position: absolute;
            bottom: var(--spacing-md);
            right: var(--spacing-md);
            display: flex;
            gap: var(--spacing-sm);
            z-index: 1;
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }
        .icon-btn svg {
            width: 24px;
            height: 24px;
            stroke: var(--fg);
            stroke-width: 1px;
            fill: none;
        }
        .icon-btn.active-btn {
            background: var(--fg);
            border-radius: 2px;
        }
        .icon-btn.active-btn svg {
            stroke: var(--bg);
        }
        .secondary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex-grow: 1;
        }
        .grid-panel {
            padding: var(--spacing-md);
        }
        .grid-panel:first-child {
            border-right: var(--border);
        }
        .panel-header {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: var(--spacing-sm);
        }
        .panel-text {
            font-size: 1.125rem;
            line-height: 1.5;
            max-width: 90%;
        }
        .panel-text p {
            margin-bottom: var(--spacing-sm);
        }
        @media (max-width: 1024px) {
            .site-wrapper {
                grid-template-columns: 280px 1fr;
            }
            .secondary-grid {
                grid-template-columns: 1fr;
            }
            .grid-panel:first-child {
                border-right: none;
                border-bottom: var(--border);
            }
        }
        @media (max-width: 768px) {
            .site-wrapper {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: relative;
                height: auto;
                border-right: none;
                border-bottom: var(--border);
            }
            .top-bar {
                display: none;
            }
        }
        /* ===== Hero Tagline ===== */
        .hero-tagline {
            margin-bottom: var(--spacing-lg);
        }
        .blink-star {
            animation: star-blink 0.4s step-end infinite;
        }
        @keyframes star-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .hero-tagline-heading {
            font-size: clamp(1.4rem, 3vw, 2.2rem);
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.02em;
            opacity: 0.4;
            margin-bottom: var(--spacing-md);
            padding: 0 var(--spacing-md);
        }
        .hero-tagline-desc {
            text-align: center;
            font-size: 1.05rem;
            line-height: 1.6;
            opacity: 0.5;
            max-width: 580px;
            margin: 0 auto var(--spacing-md);
        }
        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
        }
        .hero-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            font-family: var(--font-main);
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            color: var(--fg);
            border: var(--border);
            background: none;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .hero-btn:hover {
            background: rgba(0,0,0,0.05);
        }
        .hero-btn-primary {
            background: var(--fg);
            color: var(--bg);
        }
        .hero-btn-primary:hover {
            opacity: 0.85;
            background: var(--fg);
        }

        /* ===== New Sections ===== */
        .full-section {
            border-bottom: var(--border);
            padding: var(--spacing-lg) var(--spacing-md);
        }
        .full-section-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 0.9;
            text-align: center;
            margin-bottom: var(--spacing-xs);
        }
        .full-section-subtitle {
            text-align: center;
            font-size: 1rem;
            font-weight: 400;
            color: var(--fg);
            opacity: 0.5;
            margin-bottom: var(--spacing-lg);
        }
        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
        }
        .feature-card {
            border: var(--border);
            margin: -0.5px;
            padding: var(--spacing-md);
            transition: background 0.2s ease;
        }
        .feature-card:hover {
            background: rgba(0,0,0,0.07);
        }
        .feature-card-title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: var(--spacing-xs);
        }
        .feature-card-desc {
            font-size: 0.95rem;
            line-height: 1.5;
            opacity: 0.55;
        }
        .arch-flow {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .arch-step {
            width: 100%;
            max-width: 900px;
            border: var(--border);
            padding: var(--spacing-sm) var(--spacing-md);
            display: grid;
            grid-template-columns: 140px 1fr auto;
            align-items: center;
            gap: var(--spacing-md);
            transition: background 0.2s ease;
        }
        .arch-step:hover {
            background: rgba(0,0,0,0.07);
        }
        .arch-step-name {
            font-weight: 700;
            font-size: 0.95rem;
        }
        .arch-step-desc {
            font-size: 0.95rem;
            opacity: 0.55;
        }
        .arch-badge {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 5px 12px;
            border: var(--border);
        }
        .arch-arrow {
            text-align: center;
            padding: var(--spacing-xs) 0;
            font-size: 1.2rem;
            opacity: 0.4;
        }
        .arch-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
            max-width: 900px;
            width: 100%;
            margin-top: var(--spacing-md);
        }
        .arch-detail {
            border: var(--border);
            margin: -0.5px;
            padding: var(--spacing-sm) var(--spacing-md);
            text-align: center;
            transition: background 0.2s ease;
        }
        .arch-detail:hover {
            background: rgba(0,0,0,0.07);
        }
        .arch-detail h4 {
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }
        .arch-detail p {
            font-size: 0.8rem;
            opacity: 0.5;
        }
        .terminal-box {
            max-width: 900px;
            margin: 0 auto;
            border: var(--border);
        }
        .terminal-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: var(--border);
        }
        .terminal-dots { display: flex; gap: 8px; }
        .terminal-dot { width: 12px; height: 12px; border-radius: 50%; border: var(--border); }
        .terminal-title { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em; opacity: 0.4; }
        .terminal-body {
            padding: var(--spacing-md);
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.9;
        }
        .terminal-body .dim { opacity: 0.45; }
        .terminal-body .bold { font-weight: 700; }
        .terminal-body .menu-item { margin-left: 2em; opacity: 0.5; }
        .terminal-prompt { margin-top: var(--spacing-sm); }
        .terminal-cursor {
            display: inline-block;
            width: 9px; height: 16px;
            background: var(--fg);
            vertical-align: text-bottom;
            animation: cursor-blink 1s step-end infinite;
        }
        @keyframes cursor-blink { 0%,100%{opacity:1} 50%{opacity:0} }
        .compare-table {
            width: 100%;
            border-collapse: collapse;
            border: var(--border);
        }
        .compare-table th, .compare-table td {
            padding: 16px 24px;
            text-align: left;
            font-size: 0.95rem;
            border-bottom: var(--border);
        }
        .compare-table thead th {
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .compare-table thead th:first-child { background: transparent; }
        .compare-table tbody td:first-child { opacity: 0.5; font-weight: 500; }
        .compare-table tbody tr:last-child td { border-bottom: none; }
        .roadmap-track { position: relative; padding-top: var(--spacing-md); }
        .roadmap-line {
            display: none;
        }
        .roadmap-items {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--spacing-sm);
            position: relative;
        }
        .roadmap-item { padding-top: 10px; }
        .roadmap-dot {
            display: inline-block;
            width: 10px; height: 10px;
            border-radius: 50%;
            border: 1.5px solid var(--fg);
            background: var(--bg);
            vertical-align: middle;
            margin-right: 8px;
            animation: dot-blink 2s ease-in-out infinite;
        }
        .roadmap-dot.active {
            background: var(--fg);
        }
        @keyframes dot-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        .roadmap-badge-row {
            display: flex;
            align-items: center;
            margin-bottom: var(--spacing-xs);
        }
        .roadmap-badge {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 4px 10px;
            border: var(--border);
        }
        .roadmap-item h4 {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: -0.01em;
            margin-bottom: var(--spacing-xs);
        }
        .roadmap-item ul { list-style: none; }
        .roadmap-item li {
            font-size: 0.85rem;
            opacity: 0.5;
            padding: 2px 0;
            padding-left: 14px;
            position: relative;
        }
        .roadmap-item li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10px;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: var(--fg);
            opacity: 0.5;
        }
        .roadmap-extra {
            margin-top: var(--spacing-md);
            max-width: 280px;
        }

        /* ===== Partnerships ===== */
        .partner-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
            max-width: 1100px;
            margin: 0 auto;
        }
        .partner-card {
            border: var(--border);
            margin: -0.5px;
            padding: var(--spacing-sm) var(--spacing-md);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            transition: background 0.2s ease;
            min-height: 88px;
        }
        .partner-card:hover {
            background: rgba(0,0,0,0.07);
        }
        .partner-logo {
            width: 56px;
            height: 56px;
            flex-shrink: 0;
            border: var(--border);
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        img.partner-logo { object-fit: contain; object-position: center; padding: 4px; background: var(--bg); }
        .partner-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }
        .partner-name {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.1;
        }
        .partner-role {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            opacity: 0.5;
        }
        .partner-row-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0;
            max-width: calc(1100px * 2 / 3);
            margin: 0 auto;
        }
        .partner-row-2 .partner-card {
            min-height: 88px;
        }
        @media (max-width: 1024px) {
            .features-grid { grid-template-columns: 1fr 1fr; }
            .roadmap-items { grid-template-columns: 1fr 1fr; }
            .arch-step { grid-template-columns: 1fr; gap: var(--spacing-xs); }
            .arch-details { grid-template-columns: 1fr; }
            .partner-grid { grid-template-columns: repeat(2, 1fr); }
            .partner-row-2 { max-width: 100%; grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .features-grid { grid-template-columns: 1fr; }
            .roadmap-items { grid-template-columns: 1fr; }
            .partner-grid { grid-template-columns: 1fr; }
            .partner-row-2 { grid-template-columns: 1fr; }
        }

        /* ===== Scroll Gradient Overlay ===== */
        .scroll-gradient {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            background: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 100%);
            transition: background 0.15s ease;
        }
        /* ===== Loading Screen ===== */
        .loader-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .loader-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
        }
        .loader-star {
            width: 48px;
            height: 48px;
            animation: loader-spin 1.8s ease-in-out infinite, loader-pulse 1.8s ease-in-out infinite;
        }
        .loader-star svg {
            width: 100%;
            height: 100%;
            fill: var(--fg);
        }
        @keyframes loader-spin {
            0%   { transform: rotate(0deg) scale(0.7); }
            50%  { transform: rotate(180deg) scale(1); }
            100% { transform: rotate(360deg) scale(0.7); }
        }
        @keyframes loader-pulse {
            0%, 100% { opacity: 0.4; }
            50%      { opacity: 1; }
        }
        .loader-text {
            font-family: var(--font-main);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;

    // ===== Minimal Component System =====
    function el(tag, attrs, ...children) {
        const element = document.createElement(tag);
        if (attrs) {
            Object.entries(attrs).forEach(([key, val]) => {
                if (key === 'className') element.className = val;
                else if (key.startsWith('on')) element.addEventListener(key.slice(2).toLowerCase(), val);
                else element.setAttribute(key, val);
            });
        }
        children.flat().forEach(child => {
            if (child == null) return;
            if (typeof child === 'string') element.appendChild(document.createTextNode(child));
            else element.appendChild(child);
        });
        return element;
    }

    function svg(tag, attrs, ...children) {
        const element = document.createElementNS('http://www.w3.org/2000/svg', tag);
        if (attrs) {
            Object.entries(attrs).forEach(([key, val]) => {
                element.setAttribute(key, val);
            });
        }
        children.flat().forEach(child => {
            if (child == null) return;
            if (typeof child === 'string') element.appendChild(document.createTextNode(child));
            else element.appendChild(child);
        });
        return element;

    // ===== Loading Screen =====
    (function initLoader() {
        var overlay = document.getElementById('loader-overlay');
        var loaderText = document.getElementById('loader-text');
        var root = document.getElementById('root');
        if (!overlay || !loaderText || !root) return;

        var base = 'COLDSTAR';
        var glitchChars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%&*<>?/\\|';
        var phase = 0; // 0 = scramble reveal, 1 = loading flicker, 2 = done
        var revealIndex = 0;
        var flickerTimer = null;
        var startTime = Date.now();
        var totalDuration = 3000; // 3 seconds max

        // Phase 0: Letter-by-letter reveal with scramble (0 – 1.4s)
        function scrambleReveal() {
            if (phase > 0) return;
            var elapsed = Date.now() - startTime;
            // Reveal one letter every ~170ms
            revealIndex = Math.min(base.length, Math.floor(elapsed / 170));

            var text = '';
            for (var i = 0; i < base.length; i++) {
                if (i < revealIndex) {
                    text += base[i];
                } else if (i === revealIndex) {
                    // Active slot: rapid scramble
                    text += glitchChars[Math.floor(Math.random() * glitchChars.length)];
                } else {
                    text += glitchChars[Math.floor(Math.random() * glitchChars.length)];
                }
            }
            loaderText.textContent = text;

            if (revealIndex >= base.length) {
                phase = 1;
                loaderText.textContent = 'COLDSTAR LOADING';
                flickerLoading();
                return;
            }
            setTimeout(scrambleReveal, 35);
        }

        // Phase 1: Flicker "LOADING" text (1.4s – 2.6s)
        function flickerLoading() {
            if (phase > 1) return;
            var elapsed = Date.now() - startTime;
            if (elapsed >= totalDuration - 400) {
                phase = 2;
                dismiss();
                return;
            }

            var word = 'LOADING';
            var glitched = '';
            for (var i = 0; i < word.length; i++) {
                if (Math.random() < 0.35) {
                    glitched += glitchChars[Math.floor(Math.random() * glitchChars.length)];
                } else {
                    glitched += word[i];
                }
            }
            loaderText.textContent = 'COLDSTAR ' + glitched;
            setTimeout(flickerLoading, 50 + Math.random() * 60);
        }

        // Dismiss
        function dismiss() {
            loaderText.textContent = 'COLDSTAR';
            setTimeout(function() {
                overlay.classList.add('fade-out');
                root.classList.add('revealed');
                setTimeout(function() {
                    overlay.style.display = 'none';
                }, 500);
            }, 200);
        }

        // Start
        scrambleReveal();
    })();

    // ===== Left-side Parallax Star =====
    (function initParallaxStar() {
        var star = document.getElementById('parallax-star');
        if (!star) return;

        // The star travels down the left margin of the content area
        // It nudges right when it would overlap content boxes
        var sidebarWidth = 320;
        var baseX = sidebarWidth + 20; // just inside the content left edge
        var starSize = 22;

        function updateStar() {
            var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            var totalScrollable = document.documentElement.scrollHeight - window.innerHeight;
            var progress = Math.min(1, Math.max(0, scrollTop / Math.max(totalScrollable, 1)));

            // Vertical position: star tracks scroll progress down the viewport
            var viewH = window.innerHeight;
            var yBase = viewH * 0.15 + (progress * viewH * 0.7);

            // Find content elements the star might collide with
            var xOffset = 0;
            var contentEl = document.querySelector('.content');
            if (contentEl) {
                var contentRect = contentEl.getBoundingClientRect();
                var starScreenY = yBase;

                // Check all bordered elements for collision
                var obstacles = contentEl.querySelectorAll('.arch-step, .terminal-box, .compare-table, .feature-card, .roadmap-badge, .hero-btn, .grid-panel, .partner-card');
                for (var i = 0; i < obstacles.length; i++) {
                    var rect = obstacles[i].getBoundingClientRect();
                    // If star's Y overlaps this element vertically and element is near left edge
                    if (starScreenY > rect.top - 10 && starScreenY < rect.bottom + 10) {
                        if (rect.left < baseX - contentRect.left + 60) {
                            // Nudge star right to avoid the box
                            var nudge = rect.right - contentRect.left + 20;
                            if (nudge > xOffset) xOffset = nudge;
                        }
                    }
                }
            }

            // Smooth the x offset
            var finalX = baseX + xOffset - sidebarWidth;

            star.style.left = finalX + 'px';
            star.style.top = yBase + 'px';
            star.style.transform = 'translate(-50%, -50%) rotate(' + (progress * 360) + 'deg)';
        }

        updateStar();
        window.addEventListener('scroll', updateStar, { passive: true });
        window.addEventListener('resize', updateStar, { passive: true });
    })();

    // ===== Interactive 3D Schematic =====
    (function initSchematic3D() {
        var wrapper = document.getElementById('schematic-3d');
        var container = document.getElementById('schematic-container');
        var resetBtn = document.getElementById('schematic-reset');
        if (!wrapper || !container) return;

        var currentTiltX = 0;
        var currentTiltY = 0;
        var targetTiltX = 0;
        var targetTiltY = 0;
        var lockedHotspot = null;
        var isDragging = false;
        var dragStartX = 0;
        var dragStartY = 0;
        var dragTiltX = 0;
        var dragTiltY = 0;
        var animFrame = null;

        // Smooth spring animation
        function animate() {
            var dx = targetTiltX - currentTiltX;
            var dy = targetTiltY - currentTiltY;
            currentTiltX += dx * 0.12;
            currentTiltY += dy * 0.12;

            if (Math.abs(dx) < 0.01 && Math.abs(dy) < 0.01) {
                currentTiltX = targetTiltX;
                currentTiltY = targetTiltY;
            }

            wrapper.style.transform =
                'rotateX(' + currentTiltX + 'deg) rotateY(' + currentTiltY + 'deg)';

            if (Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01) {
                animFrame = requestAnimationFrame(animate);
            } else {
                animFrame = null;
            }
        }

        function startAnim() {
            if (!animFrame) animFrame = requestAnimationFrame(animate);
        }

        // Hotspot click → lock tilt to that corner/center
        hotspots.forEach(function(h) {
            var btn = document.getElementById('hotspot-' + h.id);
            if (!btn) return;
            btn.addEventListener('click', function(e) {
                e.stopPropagation();

                // Toggle: if already locked to this one, unlock
                if (lockedHotspot === h.id) {
                    lockedHotspot = null;
                    targetTiltX = 0;
                    targetTiltY = 0;
                    btn.classList.remove('active');
                } else {
                    // Deactivate previous
                    var prev = document.querySelector('.hotspot.active');
                    if (prev) prev.classList.remove('active');
                    lockedHotspot = h.id;
                    targetTiltX = h.tiltX;
                    targetTiltY = h.tiltY;
                    btn.classList.add('active');
                }
                startAnim();
            });
        });

        // Free-tilt: mouse move over container (only when no hotspot locked)
        container.addEventListener('mousemove', function(e) {
            if (lockedHotspot || isDragging) return;
            var rect = container.getBoundingClientRect();
            var xPct = (e.clientX - rect.left) / rect.width;   // 0..1
            var yPct = (e.clientY - rect.top) / rect.height;    // 0..1
            // Map to tilt: center = 0, edges = ±15deg
            targetTiltX = (0.5 - yPct) * 30;
            targetTiltY = (xPct - 0.5) * 30;
            startAnim();
        });

        container.addEventListener('mouseleave', function() {
            if (lockedHotspot || isDragging) return;
            targetTiltX = 0;
            targetTiltY = 0;
            startAnim();
        });

        // Drag to rotate (click + drag on the wrapper)
        wrapper.addEventListener('mousedown', function(e) {
            if (e.target.closest('.hotspot')) return;
            isDragging = true;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            dragTiltX = currentTiltX;
            dragTiltY = currentTiltY;
            wrapper.classList.add('dragging');
            lockedHotspot = null;
            var prev = document.querySelector('.hotspot.active');
            if (prev) prev.classList.remove('active');
            e.preventDefault();
        });

        window.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            var dx = e.clientX - dragStartX;
            var dy = e.clientY - dragStartY;
            targetTiltX = Math.max(-35, Math.min(35, dragTiltX + dy * 0.3));
            targetTiltY = Math.max(-35, Math.min(35, dragTiltY + dx * 0.3));
            startAnim();
        });

        window.addEventListener('mouseup', function() {
            if (!isDragging) return;
            isDragging = false;
            wrapper.classList.remove('dragging');
        });

        // Touch support
        wrapper.addEventListener('touchstart', function(e) {
            if (e.target.closest('.hotspot')) return;
            isDragging = true;
            var t = e.touches[0];
            dragStartX = t.clientX;
            dragStartY = t.clientY;
            dragTiltX = currentTiltX;
            dragTiltY = currentTiltY;
            wrapper.classList.add('dragging');
            lockedHotspot = null;
            var prev = document.querySelector('.hotspot.active');
            if (prev) prev.classList.remove('active');
        }, { passive: true });

        window.addEventListener('touchmove', function(e) {
            if (!isDragging) return;
            var t = e.touches[0];
            var dx = t.clientX - dragStartX;
            var dy = t.clientY - dragStartY;
            targetTiltX = Math.max(-35, Math.min(35, dragTiltX + dy * 0.3));
            targetTiltY = Math.max(-35, Math.min(35, dragTiltY + dx * 0.3));
            startAnim();
        }, { passive: true });

        window.addEventListener('touchend', function() {
            if (!isDragging) return;
            isDragging = false;
            wrapper.classList.remove('dragging');
        });

        // Reset button
        if (resetBtn) {
            resetBtn.addEventListener('click', function() {
                lockedHotspot = null;
                var prev = document.querySelector('.hotspot.active');
                if (prev) prev.classList.remove('active');
                targetTiltX = 0;
                targetTiltY = 0;
                startAnim();
            });
        }
    })();

    // ===== Coordinate Flicker Animation =====
    (function initCoordFlicker() {
        var coordEl = document.getElementById('coord-value');
        if (!coordEl) return;

        // Base coordinates
        var baseLat = 78;
        var baseLatMin = 13;
        var baseLng = 15;
        var baseLngMin = 33;

        // Mouse velocity tracking
        var mouseSpeed = 0;
        var lastMouseX = 0;
        var lastMouseY = 0;
        var lastMouseTime = Date.now();

        window.addEventListener('mousemove', function(e) {
            var now = Date.now();
            var dt = now - lastMouseTime;
            if (dt > 0) {
                var dx = e.clientX - lastMouseX;
                var dy = e.clientY - lastMouseY;
                var dist = Math.sqrt(dx * dx + dy * dy);
                var speed = dist / dt; // px per ms
                // Smooth: blend toward new speed
                mouseSpeed = mouseSpeed * 0.6 + speed * 0.4;
            }
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            lastMouseTime = now;
        }, { passive: true });

        // Decay mouse speed when not moving
        setInterval(function() {
            mouseSpeed *= 0.92;
        }, 50);

        // Flicker loop
        var flickerInterval = null;
        var baseInterval = 220; // ms between flicks at rest
        var minInterval = 30;   // ms between flicks at max speed

        function randOffset(range) {
            return (Math.random() - 0.5) * 2 * range;
        }

        function padMin(n) {
            var v = Math.abs(Math.round(n));
            return v < 10 ? '0' + v : '' + v;
        }

        function flicker() {
            // Scale jitter by mouse speed: faster mouse = wilder numbers
            var intensity = Math.min(1, mouseSpeed / 2.5); // 0..1
            var jitterDeg = 0.3 + intensity * 8;      // degrees wobble
            var jitterMin = 1 + intensity * 40;        // minutes wobble

            var lat = baseLat + randOffset(jitterDeg);
            var latMin = baseLatMin + randOffset(jitterMin);
            var lng = baseLng + randOffset(jitterDeg);
            var lngMin = baseLngMin + randOffset(jitterMin);

            // Keep valid-looking ranges
            lat = Math.max(0, Math.min(89, lat));
            latMin = Math.max(0, Math.min(59, latMin));
            lng = Math.max(0, Math.min(179, lng));
            lngMin = Math.max(0, Math.min(59, lngMin));

            coordEl.textContent =
                Math.round(lat) + '\u00B0' + padMin(latMin) + "'N " +
                Math.round(lng) + '\u00B0' + padMin(lngMin) + "'E";

            // Schedule next flick, faster when mouse is moving
            var nextDelay = baseInterval - intensity * (baseInterval - minInterval);
            flickerInterval = setTimeout(flicker, nextDelay);
        }

        flicker();
    })();

    // ===== Scroll Gradient Overlay =====
    (function initScrollGradient() {
        var gradientEl = document.getElementById('scroll-gradient');
        if (!gradientEl) return;

        function updateGradient() {
            var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            var totalScrollable = document.documentElement.scrollHeight - window.innerHeight;
            var progress = Math.min(1, Math.max(0, scrollTop / Math.max(totalScrollable, 1)));

            // At top: fully transparent
            // At bottom: dark grey (rgb ~40,40,40) with opacity ramping up
            // The gradient sweeps left-to-right, and both the opacity and darkness increase with scroll

            // Overall intensity: 0 at top, 1 at bottom
            var intensity = progress;

            // Left edge opacity (leading edge of the gradient)
            var leftAlpha = intensity * 0.35;
            // Right edge opacity (trailing edge, slightly less to create the L→R sweep)
            var rightAlpha = intensity * 0.18;

            // Grey value darkens: starts at ~200 (light grey), ends at ~40 (dark grey)
            var grey = Math.round(200 - intensity * 160);

            gradientEl.style.background =
                'linear-gradient(to right, ' +
                'rgba(' + grey + ',' + grey + ',' + grey + ',' + leftAlpha + ') 0%, ' +
                'rgba(' + grey + ',' + grey + ',' + grey + ',' + (leftAlpha * 0.7) + ') 40%, ' +
                'rgba(' + grey + ',' + grey + ',' + grey + ',' + rightAlpha + ') 75%, ' +
                'rgba(' + grey + ',' + grey + ',' + grey + ',' + (rightAlpha * 0.3) + ') 100%)';
        }

        updateGradient();
        window.addEventListener('scroll', updateGradient, { passive: true });
        window.addEventListener('resize', updateGradient, { passive: true });
    })();

    // ===== Terminal Boot Animation =====
    (function initTerminalBoot() {
        var body = document.getElementById('terminal-body');
        var cursor = document.getElementById('type-cursor');
        var box = document.getElementById('terminal-box');
        if (!body || !cursor) return;

        // The boot sequence, each entry is a line to type
        // type: 'type' = typewriter, 'instant' = appears instantly, 'pause' = wait, 'blank' = empty line
        var sequence = [
            { type: 'type', html: '<span class="bold">COLDSTAR v1.0</span> <span class="dim">- Air-Gapped Cold Wallet for Solana</span>', speed: 15, delay: 200 },
            { type: 'blank', delay: 150 },
            { type: 'type', html: '<span class="bold">[+]</span> <span class="dim">USB detected:</span> <span class="bold">KINGSTON 32GB</span> <span class="dim">(/dev/disk4s1)</span>', speed: 10, delay: 300 },
            { type: 'type', html: '<span class="bold">[+]</span> <span class="dim">Wallet loaded:</span> <span class="bold">7xKp...9mFv</span>', speed: 10, delay: 200 },
            { type: 'type', html: '<span class="bold">[+]</span> <span class="dim">Balance:</span> <span class="bold">12.847 SOL</span> <span class="dim">($2,441.08)</span>', speed: 10, delay: 200 },
            { type: 'type', html: '<span class="bold">[+]</span> <span class="dim">Security:</span> <span class="bold">AES-256-GCM</span> <span class="dim">encrypted</span>', speed: 10, delay: 350 },
            { type: 'blank', delay: 100 },
            { type: 'instant', html: '<span class="menu-item">1. View Wallet / Balance</span>', delay: 40 },
            { type: 'instant', html: '<span class="menu-item">2. Send SOL (Create Unsigned Transaction)</span>', delay: 40 },
            { type: 'instant', html: '<span class="menu-item">3. Sign Transaction (Air-Gapped via QR)</span>', delay: 40 },
            { type: 'instant', html: '<span class="menu-item">4. Broadcast Signed Transaction</span>', delay: 40 },
            { type: 'instant', html: '<span class="menu-item">5. Swap Tokens (Jupiter DEX)</span>', delay: 40 },
            { type: 'instant', html: '<span class="menu-item">6. Flash USB Drive</span>', delay: 40 },
            { type: 'instant', html: '<span class="menu-item">7. Backup / Restore Wallet</span>', delay: 150 },
            { type: 'blank', delay: 100 },
            { type: 'prompt', delay: 0 },
        ];

        var hasBooted = false;

        // Extract plain text from HTML for typewriter
        function stripHtml(html) {
            var tmp = document.createElement('div');
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }

        function typeLine(html, speed, callback) {
            var lineEl = document.createElement('div');
            body.insertBefore(lineEl, cursor);

            var plainText = stripHtml(html);
            var charIndex = 0;

            function typeChar() {
                if (charIndex >= plainText.length) {
                    // Replace with rich HTML version
                    lineEl.innerHTML = html;
                    callback();
                    return;
                }
                lineEl.textContent = plainText.substring(0, charIndex + 1);
                charIndex++;
                // Vary speed slightly for realism
                var nextDelay = speed + (Math.random() - 0.5) * speed * 0.6;
                setTimeout(typeChar, Math.max(8, nextDelay));
            }
            typeChar();
        }

        function instantLine(html, callback) {
            var lineEl = document.createElement('div');
            lineEl.innerHTML = html;
            lineEl.style.opacity = '0';
            lineEl.style.transform = 'translateY(4px)';
            lineEl.style.transition = 'opacity 0.15s ease, transform 0.15s ease';
            body.insertBefore(lineEl, cursor);
            // Trigger animation
            requestAnimationFrame(function() {
                lineEl.style.opacity = '1';
                lineEl.style.transform = 'translateY(0)';
            });
            callback();
        }

        function blankLine(callback) {
            var br = document.createElement('br');
            body.insertBefore(br, cursor);
            callback();
        }

        function promptLine() {
            var promptEl = document.createElement('div');
            promptEl.className = 'terminal-prompt';
            promptEl.innerHTML = '\u25B8 <span class="bold">Select an option:</span> ';
            promptEl.appendChild(cursor);
            body.appendChild(promptEl);
        }

        function runSequence(index) {
            if (index >= sequence.length) return;
            var step = sequence[index];

            setTimeout(function() {
                if (step.type === 'type') {
                    typeLine(step.html, step.speed, function() {
                        runSequence(index + 1);
                    });
                } else if (step.type === 'instant') {
                    instantLine(step.html, function() {
                        runSequence(index + 1);
                    });
                } else if (step.type === 'blank') {
                    blankLine(function() {
                        runSequence(index + 1);
                    });
                } else if (step.type === 'prompt') {
                    promptLine();
                }
            }, step.delay);
        }

        // Start boot when terminal scrolls into view
        var observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting && !hasBooted) {
                    hasBooted = true;
                    observer.disconnect();
                    setTimeout(function() { runSequence(0); }, 250);
                }
            });
        }, { threshold: 0.3 });

        observer.observe(box);
    })();

                        locScrambled += String.fromCharCode(65 + Math.floor(Math.random() * 26));
                    } else {
                        locScrambled += name[j];
                    }
                }
                locEl.textContent = locScrambled;

                glitchCount++;
                setTimeout(glitchStep, 40 + Math.random() * 30);
            }

            glitchStep();
        }
    })();
    </script>
